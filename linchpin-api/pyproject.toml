[project]
name = "linchpin-api"
version = "0.3.0"
description = "Linchpin API — FastAPI service for managed AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "sse-starlette>=2.0.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
