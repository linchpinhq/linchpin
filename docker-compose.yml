services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: linchpin
      POSTGRES_PASSWORD: linchpin
      POSTGRES_DB: linchpin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linchpin"]
      interval: 5s
      timeout: 5s
      retries: 5

  linchpin-api:
    build:
      context: ./linchpin-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://linchpin:linchpin@postgres:5432/linchpin
      LINCHPIN_API_KEY: ${LINCHPIN_API_KEY:-changeme}
      CONNECTOR_URL: http://linchpin-connector:8001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  linchpin-connector:
    build:
      context: ./linchpin-connector
    ports:
      - "8001:8001"
    environment:
      LINCHPIN_API_KEY: ${LINCHPIN_API_KEY:-changeme}

  linchpin-console:
    build:
      context: ./linchpin-console
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - linchpin-api

volumes:
  pgdata:
